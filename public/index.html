<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>o setup</title>
  <meta name="description" content="Equipamentos, links e ferramentas que eu uso." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Caveat:wght@600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --amber-light: #e8a856;
      --amber-dim: #8a5f28;
      --black: #15110e;
      --cream: #f3ead9;
      --muted: #b6a48f;
      --dim: #7a6a58;
      --line: rgba(243,234,217,.12);
    }
    body { font-family: 'Space Mono', monospace; background: var(--black); color: var(--cream); }

    /* TOP BAR */
    .lang-bar { padding: 18px 36px; display: flex; justify-content: space-between; align-items: center; }
    .brand-mark { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; color: var(--amber-light); display: flex; align-items: center; gap: 6px; }
    .lang-toggle { display: flex; gap: 4px; }
    .lang-btn { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; background: none; border: none; color: var(--dim); cursor: pointer; padding: 4px 10px; font-family: inherit; }
    .lang-btn.active { color: var(--amber-light); }
    .lang-sep { color: var(--line); font-size: 11px; }

    /* HERO */
    .hero { position: relative; padding: 20px 36px 60px; overflow: hidden; }
    .stamp { position: absolute; top: 10px; right: 36px; width: 74px; height: 74px; border: 2px solid var(--amber-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; transform: rotate(-9deg); }
    .stamp-text { font-size: 8px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--amber-light); text-align: center; line-height: 1.5; }
    .hero-kicker-badge { display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--amber-dim); border-radius: 999px; padding: 6px 16px 6px 10px; margin-bottom: 26px; }
    .hero-kicker-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber-light); }
    .hero-kicker-badge span { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--amber-light); }
    .hero-h1 { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: clamp(48px, 13vw, 128px); line-height: .88; color: var(--cream); text-transform: uppercase; letter-spacing: -.01em; }
    .hero-h1 .accent { color: var(--amber-light); position: relative; display: inline-block; }
    .circle-mark { position: absolute; left: -14px; right: -18px; top: -14px; bottom: -10px; border: 3px solid var(--amber-light); border-radius: 50% 50% 48% 52% / 55% 48% 52% 45%; transform: rotate(-2deg); pointer-events: none; }
    .hero-sub { font-size: 13.5px; color: var(--muted); line-height: 1.75; max-width: 460px; margin-top: 28px; }

    /* PROFILE */
    .profile { padding: 24px 36px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; border-top: 2px dashed var(--line); border-bottom: 2px dashed var(--line); }
    .photo-frame {
      width: 60px; height: 60px; border-radius: 8px; overflow: hidden; flex-shrink: 0;
      border: 3px solid var(--cream); transform: rotate(-4deg); box-shadow: 0 4px 10px rgba(0,0,0,.35);
      background: linear-gradient(135deg, var(--amber-light), var(--amber-dim));
      display: flex; align-items: center; justify-content: center;
      font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; color: var(--black);
    }
    .photo-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .profile-name { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px; color: var(--cream); }
    .profile-bio { font-size: 12px; color: var(--dim); margin-top: 3px; }
    .socials { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }
    .social-a { font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--black); background: var(--amber-light); text-decoration: none; padding: 6px 12px; border-radius: 5px; border: 2px solid var(--black); }
    .social-a:hover { background: #f0bb73; }

    /* SECTIONS */
    .section { border-top: 2px dashed var(--line); }
    .section-head { display: flex; align-items: center; gap: 12px; padding: 34px 36px 18px; }
    .section-num { font-size: 13px; font-weight: 700; color: var(--black); background: var(--amber-light); border-radius: 6px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .section-title { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 26px; color: var(--cream); text-transform: uppercase; }
    .section-title::after { content: ''; display: block; width: 46px; height: 4px; background: var(--amber-light); border-radius: 2px; margin-top: 8px; }

    .item { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: start; padding: 22px 36px; border-top: 1px dashed var(--line); }
    .item:first-of-type { border-top: none; }
    .item-cat { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--amber-light); margin-bottom: 6px; }
    .item-name { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; color: var(--cream); margin-bottom: 8px; line-height: 1.1; }
    .item-desc { font-size: 12.5px; color: var(--muted); line-height: 1.7; max-width: 440px; }
    .item-actions { display: flex; flex-direction: column; gap: 9px; align-items: flex-end; flex-shrink: 0; padding-top: 4px; }

    .btn-main {
      font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .02em;
      color: var(--black); background: var(--amber-light); border: 2px solid var(--black); border-radius: 4px;
      padding: 9px 16px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
      white-space: nowrap; box-shadow: 3px 3px 0 var(--black); transition: transform .1s, box-shadow .1s;
    }
    .btn-main:hover { transform: translate(1px,1px); box-shadow: 2px 2px 0 var(--black); }
    .btn-copy { font-family: 'Space Mono', monospace; font-size: 10.5px; font-weight: 700; color: var(--dim); background: none; border: none; cursor: pointer; padding: 0; }
    .btn-copy:hover { color: var(--amber-light); }

    /* GRID SECTIONS */
    .grid-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; padding: 0 36px 30px; }
    .grid-cell { background: rgba(243,234,217,.04); border: 1px dashed var(--line); border-radius: 8px; padding: 18px 20px; }
    .grid-cell-name { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px; color: var(--cream); margin-bottom: 4px; }
    .grid-cell-cat { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
    .grid-cell-link { display: inline-block; margin-top: 12px; font-size: 12px; font-weight: 700; color: var(--amber-light); text-decoration: none; }
    .grid-cell-link:hover { opacity: .75; }

    /* AFFILIATE */
    .affiliate-note { font-size: 11px; color: var(--cream); opacity: .7; text-align: center; padding: 26px 36px; border-top: 2px dashed var(--line); line-height: 1.7; }

    /* FOOTER */
    .footer { padding: 26px 36px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .footer-brand { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 20px; color: var(--amber-light); text-transform: uppercase; }

    /* TOAST */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(16px);
      background: var(--amber-light); color: var(--black); font-family: 'Space Mono', monospace;
      font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      padding: 10px 20px; border-radius: 4px; opacity: 0;
      transition: opacity .25s, transform .25s; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    #loading { padding: 80px 36px; text-align: center; color: var(--muted); font-size: 14px; }

    @media (max-width: 600px) {
      .hero, .profile, .item, .footer, .lang-bar, .affiliate-note, .section-head, .grid-items { padding-left: 20px; padding-right: 20px; }
      .item { grid-template-columns: 1fr; }
      .item-actions { flex-direction: row; }
      .socials { margin-left: 0; margin-top: 8px; }
      .stamp { display: none; }
    }
  </style>
</head>
<body>

<div class="lang-bar">
  <div class="brand-mark">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 0 L11.5 8 L20 10 L11.5 12 L10 20 L8.5 12 L0 10 L8.5 8 Z" fill="#e8a856"/></svg>
    o setup
  </div>
  <div class="lang-toggle">
    <button class="lang-btn active" id="btn-pt" onclick="setLang('pt')">PT</button>
    <span class="lang-sep">/</span>
    <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
  </div>
</div>

<div id="app">
  <div id="loading">carregando…</div>
</div>
<div class="toast" id="toast"></div>

<script>
  const API = '/api/data';
  let siteData = null;
  let lang = localStorage.getItem('lang') || 'pt';

  const i18n = {
    pt: { buy: 'Comprar →', copyLink: 'copiar link', copied: 'link copiado', access: '↗ acessar' },
    en: { buy: 'Buy →', copyLink: 'copy link', copied: 'link copied', access: '↗ open' }
  };

  function t(key) { return i18n[lang][key]; }

  function setLang(l) {
    lang = l;
    localStorage.setItem('lang', l);
    document.getElementById('btn-pt').classList.toggle('active', l === 'pt');
    document.getElementById('btn-en').classList.toggle('active', l === 'en');
    document.documentElement.lang = l === 'pt' ? 'pt-BR' : 'en';
    render();
  }

  async function load() {
    try {
      const res = await fetch(API);
      siteData = await res.json();
    } catch { siteData = null; }
    render();
  }

  function initials(name) {
    return (name || 'S').split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
  }

  function copyLink(url) {
    navigator.clipboard.writeText(url).then(() => {
      const el = document.getElementById('toast');
      el.textContent = t('copied');
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 1800);
    });
  }

  function f(obj, field) {
    return (lang === 'en' && obj[field + '_en']) ? obj[field + '_en'] : (obj[field] || '');
  }

  function renderItem(item, isGrid) {
    if (isGrid) {
      return `<div class="grid-cell">
        <div class="grid-cell-name">${f(item,'name')}</div>
        <div class="grid-cell-cat">${f(item,'label')}</div>
        ${item.url ? `<a href="${item.url}" class="grid-cell-link" target="_blank" rel="noopener">${t('access')}</a>` : ''}
      </div>`;
    }
    return `<div class="item">
      <div>
        ${f(item,'label') ? `<div class="item-cat">✦ ${f(item,'label')}</div>` : ''}
        <div class="item-name">${f(item,'name')}</div>
        ${f(item,'description') ? `<div class="item-desc">${f(item,'description')}</div>` : ''}
      </div>
      <div class="item-actions">
        ${item.url ? `<a href="${item.url}" class="btn-main" target="_blank" rel="noopener">${t('buy')}</a>` : ''}
        ${item.url ? `<button class="btn-copy" onclick="copyLink('${item.url}')">${t('copyLink')}</button>` : ''}
      </div>
    </div>`;
  }

  function renderSection(sec) {
    const isGrid = sec.type === 'grid';
    const items = isGrid
      ? `<div class="grid-items">${(sec.items||[]).map(i => renderItem(i, true)).join('')}</div>`
      : (sec.items||[]).map(i => renderItem(i, false)).join('');
    return `<div class="section">
      <div class="section-head">
        <div class="section-num">${sec.number}</div>
        <div class="section-title">${f(sec,'title')}</div>
      </div>
      ${items}
    </div>`;
  }

  function render() {
    const d = siteData;
    if (!d) {
      document.getElementById('app').innerHTML = '<div style="padding:80px 36px;color:#888;font-size:14px">erro ao carregar.</div>';
      return;
    }
    const p = d.profile || {};
    const s = d.site || {};

    const kicker = f(s, 'title') || 'setup de café';
    const headline = f(s, 'headline') || 'o que eu uso.';
    const sub = f(s, 'subheadline') || '';
    const bio = f(p, 'bio') || '';
    const affiliate = f(s, 'affiliateNote') || '';

    const words = headline.split(' ');
    const last = words.pop();
    const rest = words.join(' ');

    document.title = kicker;

    const socialLinks = [
      p.instagram && `<a href="${p.instagram}" class="social-a" target="_blank" rel="noopener">instagram ↗</a>`,
      p.youtube   && `<a href="${p.youtube}"   class="social-a" target="_blank" rel="noopener">youtube ↗</a>`,
      p.twitter   && `<a href="${p.twitter}"   class="social-a" target="_blank" rel="noopener">twitter ↗</a>`,
    ].filter(Boolean).join('');

    const avatar = p.photo
      ? `<img src="${p.photo}" alt="${p.name || ''}" />`
      : initials(p.name);

    document.getElementById('app').innerHTML = `
      <div class="hero">
        <div class="stamp"><div class="stamp-text">CAFÉ<br/>ARTESANAL<br/>★ EST. 2026</div></div>
        <div class="hero-kicker-badge"><span class="dot"></span><span>${kicker}</span></div>
        <h1 class="hero-h1">${rest} <span class="accent">${last}<span class="circle-mark"></span></span></h1>
        <p class="hero-sub">${sub}</p>
      </div>

      <div class="profile">
        <div class="photo-frame">${avatar}</div>
        <div>
          <div class="profile-name">${p.name || ''}</div>
          <div class="profile-bio">${bio}</div>
        </div>
        ${socialLinks ? `<div class="socials">${socialLinks}</div>` : ''}
      </div>

      ${(d.sections || []).map(renderSection).join('')}

      ${s.showAffiliateNote && affiliate ? `<div class="affiliate-note">☕ ${affiliate}</div>` : ''}

      <div class="footer">
        <div class="footer-brand">o setup ✦</div>
        ${socialLinks ? `<div class="socials">${socialLinks}</div>` : ''}
      </div>
    `;
  }

  setLang(lang);
  load();
</script>
</body>
</html>
